<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 86" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich 3D volumetric radial gradient for Blue Cloud -->
    <radialGradient id="ca-fav-body" cx="48%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#a0e2ff" />
      <stop offset="28%" stop-color="#4aa4ff" />
      <stop offset="68%" stop-color="#1f6ee8" />
      <stop offset="100%" stop-color="#1042b5" />
    </radialGradient>

    <!-- Smooth crescent gloss gradient -->
    <linearGradient id="ca-fav-crescent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <clipPath id="ca-fav-clip">
      <path d="M 32,68 C 20,68 10,59 10,48 C 10,38 19,32 30,33 C 33,21 44,14 56,14 C 68,14 77,21 80,31 C 89,32 96,40 96,50 C 96,60 88,68 76,68 C 62,70 44,70 32,68 Z" />
    </clipPath>

    <filter id="ca-fav-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="ca-fav-fine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.75" />
    </filter>
    <filter id="ca-fav-wide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="ca-fav-shadow" filterUnits="userSpaceOnUse" x="-10" y="60" width="126" height="26">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Clean floating contact shadow -->
  <ellipse cx="53" cy="74" rx="33" ry="3.6" fill="#0f2b66" fill-opacity="0.22" filter="url(#ca-fav-shadow)" />

  <!-- Jelly Cloud Body -->
  <path d="M 32,68 C 20,68 10,59 10,48 C 10,38 19,32 30,33 C 33,21 44,14 56,14 C 68,14 77,21 80,31 C 89,32 96,40 96,50 C 96,60 88,68 76,68 C 62,70 44,70 32,68 Z" fill="url(#ca-fav-body)" />

  <!-- Glassy 3D Reflections and Highlights -->
  <g clip-path="url(#ca-fav-clip)">
    <!-- Subsurface ambient bounce lighting -->
    <ellipse cx="53" cy="65" rx="28" ry="9" fill="#7ed0ff" fill-opacity="0.32" filter="url(#ca-fav-wide)" />

    <!-- Subtle bottom shadow depth -->
    <path d="M 32,68 C 20,68 10,59 10,48 C 10,38 19,32 30,33 C 33,21 44,14 56,14 C 68,14 77,21 80,31 C 89,32 96,40 96,50 C 96,60 88,68 76,68 C 62,70 44,70 32,68 Z" fill="none" stroke="#092870" stroke-opacity="0.22" stroke-width="5" filter="url(#ca-fav-soft)" />

    <!-- Delicate crisp glass inner rim -->
    <path d="M 32,68 C 20,68 10,59 10,48 C 10,38 19,32 30,33 C 33,21 44,14 56,14 C 68,14 77,21 80,31 C 89,32 96,40 96,50 C 96,60 88,68 76,68 C 62,70 44,70 32,68 Z" fill="none" stroke="#ffffff" stroke-opacity="0.36" stroke-width="2" filter="url(#ca-fav-fine)" />

    <!-- Top Dome curved glossy crescent -->
    <path d="M 36,30 C 39,21 47,16 56,16 C 65,16 73,21 76,30 C 71,23 64,19.5 56,19.5 C 48,19.5 41,23 36,30 Z" fill="url(#ca-fav-crescent)" />

    <!-- Top Dome glassy crest highlight -->
    <path d="M 39,26 C 42,18 48,15 56,15 C 64,15 70,18 73,26" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.4" filter="url(#ca-fav-soft)" />
    <path d="M 41,24 C 44,17.5 49,15 56,15 C 63,15 68,17.5 71,24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95" filter="url(#ca-fav-fine)" />
    <path d="M 45,21 C 48,17.5 52,16 56,16 C 60,16 64,17.5 67,21" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0" />

    <!-- Left lobe crisp rim highlight -->
    <path d="M 16,45 C 16,36.5 22,32 29,32.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.82" filter="url(#ca-fav-fine)" />

    <!-- Right lobe crisp rim highlight -->
    <path d="M 81,33 C 88,34 92,39 92.5,46" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" filter="url(#ca-fav-fine)" />

    <!-- Specular glints -->
    <ellipse cx="64" cy="20" rx="3" ry="1.8" transform="rotate(-20 64 20)" fill="#ffffff" fill-opacity="1.0" />
    <circle cx="70.5" cy="23" r="1.4" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Expressive Bot Eyes with specular shine -->
  <g class="agent-bot-eyes">
    <ellipse cx="45.5" cy="43" rx="3.6" ry="5.2" fill="#091b38" />
    <ellipse cx="60.5" cy="43" rx="3.6" ry="5.2" fill="#091b38" />
    <!-- Primary eye shines -->
    <circle cx="47" cy="41.2" r="1.5" fill="#ffffff" fill-opacity="0.95" />
    <circle cx="62" cy="41.2" r="1.5" fill="#ffffff" fill-opacity="0.95" />
    <!-- Secondary cute micro-shines -->
    <circle cx="44.5" cy="44.5" r="0.8" fill="#ffffff" fill-opacity="0.75" />
    <circle cx="59.5" cy="44.5" r="0.8" fill="#ffffff" fill-opacity="0.75" />
  </g>
</svg>
